  schemas:
    ApiResponse:
      type: object
      description: >
        统一响应信封。M1 契约固定为 code/message/data/traceId；
        后续所有成功和失败响应都必须通过本信封或 allOf 派生 schema 表达。
        响应消息字段只允许使用 message，不保留旧项目 info 或 msg 等兼容别名。
      required:
        - code
        - message
        - data
        - traceId
      properties:
        code:
          type: string
          description: 业务状态码。成功为 0000，失败使用 ErrorCode 枚举。
          example: "0000"
        message:
          type: string
          description: 面向前端展示或日志定位的中文信息。message 是唯一响应消息字段，不保留 info、msg 等别名。
          example: 成功
        data:
          description: 成功时承载业务数据；无返回数据时为 null 或布尔结果；失败时为 null 或 ErrorDetail。
        traceId:
          type: string
          description: 请求追踪 ID。响应、日志和后台审计必须使用同一值。
          example: trace-20260525-001
    ErrorResponse:
      description: >
        统一错误响应。错误响应仍使用 ApiResponse 信封：
        code 为 ErrorCode，message 为中文错误说明，data 可为 null；
        需要前端定位字段、资源或状态时，data 使用 ErrorDetail。
        HTTP 状态必须表达协议层语义，例如 400/401/403/404/409/500；
        body 不因错误类型改变，仍固定使用 code/message/data/traceId。
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          required:
            - code
            - message
            - data
            - traceId
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            data:
              description: 失败上下文；没有可安全暴露的上下文时为 null。
              $ref: "#/components/schemas/ErrorDetail"
    ErrorDetail:
      type: object
      nullable: true
      description: >
        错误详情对象。仅放入可安全暴露给前端和 Mock 的定位信息；
        不返回异常堆栈、SQL、Redis key 或内部类名。字段不足时可用 details 承载扩展上下文。
      additionalProperties: true
      properties:
        field:
          type: string
          description: 参数或表单字段名。
          example: username
        reason:
          type: string
          description: 失败原因或校验说明。
          example: 用户名长度必须为 4 到 20 位
        resourceType:
          type: string
          description: 资源类型。
          example: ORDER
        resourceId:
          type: string
          description: 资源 ID。
          example: ORD-20260525-0001
        activityId:
          type: integer
          format: int64
          description: 活动 ID。
          example: 20001
        orderId:
          type: string
          description: 订单号。
          example: ORD-20260525-0001
        teamId:
          type: string
          description: 队伍号。
          example: TEAM-20260525-001
        tagId:
          type: string
          description: 标签 ID。
          example: TAG-VIP-001
        currentStatus:
          type: string
          description: 当前状态。
          example: REFUNDED
        expectedStatus:
          type: string
          description: 期望状态。
          example: PAID
        retryable:
          type: boolean
          description: 前端或治理端是否可以提示重试。
          example: false
        details:
          type: object
          description: 其他结构化上下文。
          additionalProperties: true
    ErrorCode:
      type: string
      description: 项目错误码。实现时可以扩展，但不得改变已有语义。
      enum:
        - "0000"
        - AUTH_401
        - AUTH_403
        - AUTH_USERNAME_DUPLICATED
        - AUTH_PHONE_DUPLICATED
        - AUTH_PASSWORD_MISMATCH
        - AUTH_PHONE_INVALID
        - AUTH_BAD_CREDENTIALS
        - AUTH_CODE_INVALID
        - AUTH_ACCOUNT_DISABLED
        - AUTH_ADMIN_REQUIRED
        - MARKET_NOT_FOUND
        - MARKET_ACTIVITY_UNAVAILABLE
        - MARKET_TAG_NOT_MATCHED
        - TRADE_TEAM_FULL
        - TRADE_ORDER_STATUS_INVALID
        - TRADE_PRICE_CHANGED
        - TRADE_ORDER_NOT_FOUND
        - TRADE_ORDER_FORBIDDEN
        - ADMIN_INVALID_OPERATION
        - SYSTEM_PARAM_INVALID
        - SYSTEM_ERROR
    PageResponse:
      type: object
      description: >
        统一分页数据结构。所有分页响应必须放在 ApiResponse.data 中，
        并固定使用 pageNo/pageSize/total/items；不再新增 list、records 等并行字段。
      required:
        - pageNo
        - pageSize
        - total
        - items
      properties:
        pageNo:
          type: integer
          minimum: 1
          description: 当前页码，从 1 开始。
          example: 1
        pageSize:
          type: integer
          minimum: 1
          description: 每页数量。
          example: 10
        total:
          type: integer
          format: int64
          minimum: 0
          description: 符合条件的总条数。
          example: 1
        items:
          type: array
          description: 当前页数据列表，具体元素类型由派生 schema 覆盖。
          items:
            type: object

    UserRole:
      type: string
      enum:
        - USER
        - ADMIN
