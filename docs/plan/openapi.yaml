components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token
      description: 登录接口返回的 token。后端可用 Redis session 承载。

  parameters:
    PageNo:
      name: pageNo
      in: query
      required: false
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页数量
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Source:
      name: source
      in: query
      required: true
      description: 流量来源
      schema:
        type: string
        example: APP
    Channel:
      name: channel
      in: query
      required: true
      description: 渠道
      schema:
        type: string
        example: H5
    ActivityId:
      name: activityId
      in: path
      required: true
      description: 活动 ID
      schema:
        type: integer
        format: int64
        example: 20001
    OrderId:
      name: orderId
      in: path
      required: true
      description: 订单 ID
      schema:
        type: string
        example: ORD-20260525-0001
    EventId:
      name: eventId
      in: path
      required: true
      description: 可靠事件 ID
      schema:
        type: string
        example: EVT-20260525-0001

  responses:
    BadRequest:
      description: 请求参数或业务规则不满足
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidParam:
              value:
                code: SYSTEM_PARAM_INVALID
                message: 请求参数不合法
                data:
                  field: username
                  reason: 用户名长度必须为 4 到 20 位
                traceId: trace-param-001
    Unauthorized:
      description: 未登录或登录已过期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unauthorized:
              value:
                code: AUTH_401
                message: 未登录或登录已过期
                data: null
                traceId: trace-auth-401
    Forbidden:
      description: 权限不足或访问他人资源
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            forbidden:
              value:
                code: AUTH_403
                message: 权限不足
                data: null
                traceId: trace-auth-403
    MarketNotFound:
      description: 活动或商品不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                code: MARKET_NOT_FOUND
                message: 活动或商品不存在
                data:
                  activityId: 20001
                traceId: trace-market-404
    OrderNotFound:
      description: 订单不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            notFound:
              value:
                code: TRADE_ORDER_NOT_FOUND
                message: 订单不存在
                data:
                  orderId: ORD-20260525-0001
                traceId: trace-order-404
    TradeInvalidStatus:
      description: 订单状态冲突，不允许当前操作
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            invalidStatus:
              value:
                code: TRADE_ORDER_STATUS_INVALID
                message: 当前订单状态不允许操作
                data:
                  orderId: ORD-20260525-0001
                  currentStatus: REFUNDED
                traceId: trace-trade-status-001
    InternalServerError:
      description: 系统异常
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            systemError:
              value:
