    RegisterRequest:
      type: object
      required:
        - username
        - password
        - confirmPassword
        - phone
        - code
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 20
          pattern: "^[A-Za-z0-9_]+$"
          description: 用户名，4 到 20 位英文、数字或下划线，注册后唯一。
        password:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: 登录密码。服务端只保存 bcrypt hash，不返回明文。
        confirmPassword:
          type: string
          minLength: 8
          maxLength: 64
          format: password
          description: 确认密码，必须与 password 一致。
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          description: 注册手机号，必须唯一，并与验证码发送手机号一致。
        code:
          type: string
          pattern: "^[0-9]{6}$"
          description: 注册验证码，必须来自 `/api/v1/auth/code` 且 `purpose=REGISTER`，与 phone 匹配并在有效期内。
    SendCodeRequest:
      type: object
      required:
        - phone
        - purpose
      properties:
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
          description: 接收验证码的手机号。
        purpose:
          $ref: "#/components/schemas/CodePurpose"
    PasswordLoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
          description: 用户名或手机号。后端根据格式识别账号类型。
        password:
          type: string
          format: password
        requiredRole:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: 可选请求角色。管理端登录传 ADMIN，后端必须校验登录账号角色，不信任前端授权。
    CodeLoginRequest:
      type: object
      required:
        - phone
        - code
      properties:
        phone:
          type: string
          pattern: "^1[3-9][0-9]{9}$"
        code:
          type: string
          pattern: "^[0-9]{6}$"
        requiredRole:
          allOf:
            - $ref: "#/components/schemas/UserRole"
          description: 可选请求角色。管理端验证码登录如需复用该接口，传 ADMIN 并由后端校验。
    CurrentUser:
      type: object
      required:
        - userId
        - username
        - role
        - status
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
        phone:
          type: string
          nullable: true
        role:
          $ref: "#/components/schemas/UserRole"
        status:
          $ref: "#/components/schemas/UserStatus"
    AuthSession:
      type: object
      required:
        - token
        - tokenType
        - expiresInSeconds
        - user
      properties:
        token:
          type: string
          description: "登录 token。前端请求时放入 Authorization: Bearer {token}。"
        tokenType:
          type: string
          enum:
            - Bearer
          description: Authorization 请求头使用的 token 类型。
        expiresInSeconds:
          type: integer
          example: 1800
          description: 登录态剩余有效秒数。M3 后端默认由 Redis session TTL 决定。
        user:
          $ref: "#/components/schemas/CurrentUser"
    SendCodeResult:
      type: object
      required:
        - sent
        - ttlSeconds
      properties:
        sent:
          type: boolean
        ttlSeconds:
          type: integer
        mockCode:
          type: string
          nullable: true
          description: 仅 local profile 允许返回。

    HealthStatus:
      type: object
      required:
