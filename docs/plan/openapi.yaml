openapi: 3.0.3
info:
  title: 众享拼 API
  version: 0.2.0
  description: 众享拼 P0 接口契约。本文档是前后端、Mock、M3 后落地的后端 DTO 和验收用例的共同依据。响应消息字段统一为 message，不保留旧项目 info 兼容别名；错误响应通过 HTTP 状态表达协议层语义，同时 body 仍使用 code/message/data/traceId 信封。
servers:
  - url: http://localhost:8091
    description: 本地开发服务
tags:
  - name: 健康检查
    description: 应用、数据库和 Redis 健康状态
  - name: 认证
    description: 用户注册、登录、验证码、当前用户和登出
  - name: 会场
    description: 会场活动、商品详情和活动试算
  - name: 交易
    description: 锁单、Mock 支付和退款
  - name: 订单
    description: 当前用户订单查询
  - name: 后台-订单
    description: 管理端订单查询和退款治理
  - name: 后台-任务
    description: 可靠事件、通知和补偿任务治理
  - name: 后台-活动
    description: 活动配置、启停和 SKU 绑定
  - name: 后台-标签
    description: 标签任务、执行和命中检查
  - name: 后台-配置
    description: DCC、线程池和审计日志
security:
  - BearerAuth: []

paths:
  /api/v1/health:
    get:
      tags:
        - 健康检查
      summary: 查询健康状态
      description: 本地和部署环境用于确认应用、数据库和 Redis 是否可用。
      security: []
      responses:
        "200":
          description: 健康状态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthApiResponse"
              examples:
                success:
                  summary: 服务健康
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-health-001
                    data:
                      app: UP
                      db: UP
                      redis: UP
                      profile: local
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/register:
    post:
      tags:
        - 认证
      summary: 用户注册
      description: 注册普通用户。用户名、手机号必须满足唯一约束，密码只允许在服务端保存 bcrypt hash。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            examples:
              normal:
                summary: 用户名密码注册
                value:
                  username: user001
                  password: Zxp123456
                  confirmPassword: Zxp123456
                  phone: "13800000001"
                  code: "123456"
      responses:
        "200":
          description: 注册成功并返回登录态
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/AuthSessionSuccess"
        "400":
          description: 注册参数或唯一性校验失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                usernameDuplicated:
                  $ref: "#/components/examples/AuthUsernameDuplicated"
                phoneDuplicated:
                  $ref: "#/components/examples/AuthPhoneDuplicated"
                passwordMismatch:
                  $ref: "#/components/examples/AuthPasswordMismatch"
                codeInvalid:
                  $ref: "#/components/examples/AuthCodeInvalid"

  /api/v1/auth/code:
    post:
      tags:
        - 认证
      summary: 发送验证码
      description: 向手机号发送验证码。本地 profile 可返回 mockCode，非本地环境不得返回验证码明文。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendCodeRequest"
            examples:
              register:
                summary: 注册验证码
                value:
                  phone: "13800000001"
                  purpose: REGISTER
              login:
                summary: 登录验证码
                value:
                  phone: "13800000001"
                  purpose: LOGIN
      responses:
        "200":
          description: 验证码发送结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendCodeApiResponse"
              examples:
                local:
                  summary: 本地环境返回 mockCode
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-auth-code-001
                    data:
                      sent: true
                      ttlSeconds: 120
                      mockCode: "123456"
                production:
                  summary: 非本地环境不返回验证码明文
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-auth-code-002
                    data:
                      sent: true
                      ttlSeconds: 120
        "400":
          description: 手机号或验证码用途不合法
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                phoneInvalid:
                  $ref: "#/components/examples/AuthPhoneInvalid"

  /api/v1/auth/login/password:
    post:
      tags:
        - 认证
      summary: 密码登录
      description: 使用用户名或手机号登录。禁用账号和密码错误必须返回稳定错误码。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordLoginRequest"
            examples:
              normal:
                value:
                  account: user001
                  password: Zxp123456
              admin:
                summary: 管理端复用密码登录并要求 ADMIN 角色
                value:
                  account: admin001
                  password: Admin123456
                  requiredRole: ADMIN
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/AuthSessionSuccess"
                adminSuccess:
                  $ref: "#/components/examples/AdminAuthSessionSuccess"
        "400":
          description: 登录失败
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badCredentials:
                  $ref: "#/components/examples/AuthBadCredentials"
        "403":
          description: 账号禁用或不具备请求角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accountDisabled:
                  $ref: "#/components/examples/AuthAccountDisabled"
                adminRequired:
                  $ref: "#/components/examples/AuthAdminRequired"

  /api/v1/auth/login/code:
    post:
      tags:
        - 认证
      summary: 验证码登录
      description: 手机号不存在时可创建轻量账号；验证码使用后必须失效。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodeLoginRequest"
            examples:
              normal:
                value:
                  phone: "13800000001"
                  code: "123456"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/AuthSessionSuccess"
        "400":
          description: 验证码错误或过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                codeInvalid:
                  $ref: "#/components/examples/AuthCodeInvalid"
        "403":
          description: 账号禁用或不具备请求角色
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                accountDisabled:
                  $ref: "#/components/examples/AuthAccountDisabled"
                adminRequired:
                  $ref: "#/components/examples/AuthAdminRequired"

  /api/v1/auth/me:
    get:
      tags:
        - 认证
      summary: 查询当前用户
      description: 当前用户只来自服务端登录态，前端传入 userId 不可信。
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserApiResponse"
              examples:
                success:
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-auth-me-001
                    data:
                      userId: 10001
                      username: user001
                      phone: "13800000001"
                      role: USER
                      status: ENABLED
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags:
        - 认证
      summary: 登出
      description: 清理当前登录态。
      responses:
        "200":
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BooleanApiResponse"
              examples:
                success:
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-auth-logout-001
                    data: true
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/market/activities:
    get:
      tags:
        - 会场
      summary: 查询会场活动列表
      description: 一次返回商品、活动、拼团价、统计和可参团队伍摘要，避免前端自行拼装复杂业务数据。
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Channel"
        - name: category
          in: query
          required: false
          description: 商品分类
          schema:
            type: string
            example: food
      responses:
        "200":
          description: 会场分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActivityPageApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/MarketActivityPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/market/activities/{activityId}:
    get:
      tags:
        - 会场
      summary: 查询活动详情
      description: 返回商品详情、活动配置和可参团队伍，详情页进入后仍需调用试算接口确认价格和资格。
      parameters:
        - $ref: "#/components/parameters/ActivityId"
        - $ref: "#/components/parameters/Source"
        - $ref: "#/components/parameters/Channel"
      responses:
        "200":
          description: 活动详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketActivityDetailApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/MarketActivityDetailSuccess"
        "404":
          $ref: "#/components/responses/MarketNotFound"
        "409":
          description: 活动不可用
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                activityUnavailable:
                  $ref: "#/components/examples/MarketActivityUnavailable"

  /api/v1/market/trials:
    post:
      tags:
        - 会场
      summary: 活动试算
      description: 校验活动、渠道、时间、标签和限购，返回价格快照和可参团队伍。锁单前后端必须重新试算，不能信任前端价格。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrialRequest"
            examples:
              normal:
                value:
                  activityId: 20001
                  skuId: 30001
                  source: APP
                  channel: H5
                  joinTeamId: TEAM-20260525-001
      responses:
        "200":
          description: 试算成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrialApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/TrialSuccess"
                noAvailableTeams:
                  $ref: "#/components/examples/TrialNoAvailableTeams"
        "403":
          description: 当前用户不满足活动人群要求
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                tagNotMatched:
                  $ref: "#/components/examples/MarketTagNotMatched"
        "404":
          $ref: "#/components/responses/MarketNotFound"
        "409":
          description: 活动不可用或状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                activityUnavailable:
                  $ref: "#/components/examples/MarketActivityUnavailable"

  /api/v1/trade/orders/lock:
    post:
      tags:
        - 交易
      summary: 锁单
      description: 开团或参团创建 WAIT_PAY 订单。后端以登录态 userId 为准，并使用 userId + clientOrderNo 幂等。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LockOrderRequest"
            examples:
              createTeam:
                summary: 开团锁单
                value:
                  clientOrderNo: CLIENT-20260525-0001
                  activityId: 20001
                  skuId: 30001
                  source: APP
                  channel: H5
              joinTeam:
                summary: 参团锁单
                value:
                  clientOrderNo: CLIENT-20260525-0002
                  activityId: 20001
                  skuId: 30001
                  teamId: TEAM-20260525-001
                  source: APP
                  channel: H5
      responses:
        "200":
          description: 锁单成功或幂等返回已有订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LockOrderApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/LockOrderSuccess"
                replay:
                  summary: 重复 clientOrderNo 幂等返回
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-trade-lock-002
                    data:
                      orderId: ORD-20260525-0001
                      clientOrderNo: CLIENT-20260525-0001
                      teamId: TEAM-20260525-001
                      orderStatus: WAIT_PAY
                      teamStatus: PROGRESS
                      payPriceCent: 7900
                      payDeadline: "2026-05-25T10:15:00+08:00"
                      canPay: true
                      idempotentReplay: true
        "409":
          description: 锁单资源状态冲突
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                teamFull:
                  value:
                    code: TRADE_TEAM_FULL
                    message: 当前队伍已满
                    data:
                      teamId: TEAM-20260525-001
                    traceId: trace-trade-err-001
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/trade/payments/mock:
    post:
      tags:
        - 交易
      summary: Mock 支付结算
      description: 本地和 P0 演示使用的支付结算接口。使用 payNo 幂等，只允许 WAIT_PAY 订单进入 PAID。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MockPayRequest"
            examples:
              normal:
                value:
                  orderId: ORD-20260525-0001
                  payNo: PAY-20260525-0001
      responses:
        "200":
          description: 支付成功或幂等返回支付结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/PaymentSuccess"
                replay:
                  summary: 重复 payNo 幂等返回
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-pay-002
                    data:
                      orderId: ORD-20260525-0001
                      payNo: PAY-20260525-0001
                      orderStatus: PAID
                      teamStatus: COMPLETE
                      paidAt: "2026-05-25T10:02:00+08:00"
                      completed: true
                      idempotentReplay: true
        "409":
          $ref: "#/components/responses/TradeInvalidStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/trade/refunds:
    post:
      tags:
        - 交易
      summary: 用户退款
      description: 当前用户对自己的 PAID 订单发起退款。使用 refundNo 幂等，退款来源为 USER。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRefundRequest"
            examples:
              normal:
                value:
                  orderId: ORD-20260525-0001
                  refundNo: RF-20260525-0001
                  reason: 用户主动退款
      responses:
        "200":
          description: 退款成功或幂等返回退款结果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/RefundSuccess"
        "409":
          $ref: "#/components/responses/TradeInvalidStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/orders:
    get:
      tags:
        - 订单
      summary: 查询当前用户订单列表
      description: 只查询当前登录用户订单，不能通过请求参数传入可信 userId。
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
        - name: status
          in: query
          required: false
          description: 订单状态筛选
          schema:
            $ref: "#/components/schemas/OrderStatus"
      responses:
        "200":
          description: 当前用户订单分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPageApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/OrderPageSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/orders/{orderId}:
    get:
      tags:
        - 订单
      summary: 查询当前用户订单详情
      description: 必须校验订单归属，禁止水平越权。
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/OrderDetailSuccess"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"

  /api/v1/admin/orders:
    get:
      tags:
        - 后台-订单
      summary: 后台查询订单列表
      description: 管理员按订单号、队伍号、用户、状态和时间查询订单。
      parameters:
        - $ref: "#/components/parameters/PageNo"
        - $ref: "#/components/parameters/PageSize"
        - name: orderId
          in: query
          required: false
          schema:
            type: string
        - name: teamId
          in: query
          required: false
          schema:
            type: string
        - name: userId
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - name: startTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: endTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: 后台订单分页
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrderPageApiResponse"
              examples:
                success:
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-admin-order-list-001
                    data:
                      pageNo: 1
                      pageSize: 10
                      total: 1
                      items:
                        - orderId: ORD-20260525-0001
                          clientOrderNo: CLIENT-20260525-0001
                          userId: 10001
                          username: user001
                          activityId: 20001
                          skuId: 30001
                          goodsName: 桂花豆沙粽礼盒
                          teamId: TEAM-20260525-001
                          orderStatus: PAID
                          teamStatus: COMPLETE
                          originalPriceCent: 9900
                          discountCent: 2000
                          payPriceCent: 7900
                          canPay: false
                          canRefund: true
                          createdAt: "2026-05-25T10:00:00+08:00"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/orders/{orderId}:
    get:
      tags:
        - 后台-订单
      summary: 后台查询订单详情
      description: 返回价格快照、支付记录、退款记录、团队状态和审计辅助字段。
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: 后台订单详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderDetailApiResponse"
              examples:
                success:
                  $ref: "#/components/examples/OrderDetailSuccess"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/OrderNotFound"

  /api/v1/admin/orders/{orderId}/refunds:
    post:
      tags:
        - 后台-订单
      summary: 后台订单退款
      description: 管理员对 PAID 订单发起退款，必须填写原因并记录审计。使用 refundNo 幂等。
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRefundRequest"
            examples:
              normal:
                value:
                  refundNo: RF-ADMIN-20260525-0001
                  reason: 客诉补偿退款
                  operatorConfirm: true
      responses:
        "200":
          description: 退款成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefundApiResponse"
              examples:
                success:
                  value:
                    code: "0000"
                    message: 成功
                    traceId: trace-admin-refund-001
                    data:
                      orderId: ORD-20260525-0001
                      refundNo: RF-ADMIN-20260525-0001
                      refundSource: ADMIN
                      orderStatus: REFUNDED
                      teamStatus: COMPLETE_AFTER_REFUND
                      refundedAt: "2026-05-25T11:00:00+08:00"
        "409":
          $ref: "#/components/responses/TradeInvalidStatus"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/admin/events/overview:
    get:
      tags:
        - 后台-任务
      summary: 查询任务治理概览
      description: 返回待处理、失败、处理中、今日成功等任务数量。
      responses:
        "200":
